<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sistema de Ocorrências - Logística</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
    .navbar { display: flex; background: #2c3e50; padding: 10px; justify-content: center; gap: 15px; }
    .nav-btn { background: #34495e; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 4px; }
    .nav-btn.active { background: #27ae60; }
    .container { max-width: 1000px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .page { display: none; }
    .page.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; font-size: 15px; }
    button { background: #2980b9; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #3498db; }
    .btn-excel { background-color: #27ae60; width: auto; margin-bottom: 15px; display: inline-block; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #2c3e50; color: white; }
    tr:hover { background-color: #f1f1f1; cursor: pointer; }
    .hidden { display: none; }
    #preview { max-width: 150px; margin-top: 10px; display: none; border-radius: 4px; border: 1px solid #ddd; }
    .loading { font-weight: bold; color: #e67e22; text-align: center; padding: 10px; display: none; }
  </style>
</head>
<body>

  <div class="navbar">
    <button class="nav-btn active" onclick="mudarAba('motorista')">📱 Motorista</button>
    <button class="nav-btn" onclick="mudarAba('pc'); atualizarPainel();">💻 Painel PC</button>
  </div>

  <div class="container">
    
    <div id="pag-motorista" class="page active">
      <h2>Registro de Ocorrência (Motorista)</h2>
      
      <div class="form-group">
        <label>Tipo de Operação:</label>
        <select id="tipoRegistro" onchange="alternarCamposMotorista()">
          <option value="novo">Nova Ocorrência</option>
          <option value="existente">Atualizar Caso Existente</option>
        </select>
      </div>

      <div id="campoCasoExistente" class="form-group hidden">
        <label>Selecione o ID do Caso:</label>
        <select id="listaCasos"></select>
      </div>

      <div id="camposNovos">
        <div class="form-group">
          <label>Nome do Motorista:</label>
          <input type="text" id="motorista" placeholder="Nome Completo">
        </div>
        <div class="form-group">
          <label>Placa do Veículo:</label>
          <input type="text" id="placa" placeholder="ABC1D23">
        </div>
        <div class="form-group">
          <label>Tipo de Veículo:</label>
          <select id="tipoVeiculo">
            <option value="Toco">Toco</option>
            <option value="Truck">Truck</option>
            <option value="Carreta">Carreta</option>
            <option value="Fiorino/Van">Fiorino / Van</option>
          </select>
        </div>
        <div class="form-group">
          <label>Número da NF:</label>
          <input type="number" id="notaFiscal">
        </div>
        <div class="form-group">
          <label>Série da NF:</label>
          <input type="number" id="serie">
        </div>
        <div class="form-group">
          <label>Anexar Foto da Ocorrência:</label>
          <input type="file" id="foto" accept="image/*" onchange="visualizarFoto(event)">
          <img id="preview" alt="Prévia da imagem">
        </div>
      </div>

      <div class="form-group">
        <label>Status da Entrega:</label>
        <select id="status">
          <option value="Em trânsito">Em trânsito</option>
          <option value="Entregue">Entregue</option>
          <option value="Insucesso de Entrega">Insucesso de Entrega</option>
          <option value="Devolução Total">Devolução Total</option>
        </select>
      </div>

      <div id="loadingForm" class="loading">Processando e enviando dados, por favor aguarde...</div>
      <button id="btnEnviar" onclick="enviarDadosMotorista()">Enviar Informações</button>
    </div>

    <div id="pag-pc" class="page">
      <h2>Painel de Controle - Monitoramento</h2>
      <button class="btn-excel" onclick="exportarExcel()">📊 Gerar Excel</button>
      
      <table id="tabelaOcorrencias">
        <thead>
          <tr>
            <th>ID Caso</th>
            <th>Motorista</th>
            <th>Placa</th>
            <th>Veículo</th>
            <th>NF</th>
            <th>Série</th>
            <th>Status</th>
            <th>Data / Hora</th>
            <th>Foto</th>
          </tr>
        </thead>
        <tbody id="corpoTabela">
          <tr><td colspan="9">Carregando dados...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // ⚠️ COLE A SUA URL DA IMPLANTAÇÃO DO GOOGLE AQUI DENTRO DAS ASPAS
    const URL_API_GOOGLE = "https://script.google.com/macros/s/AKfycbyg1p04Z6u8m6uMXArffn8mYq1J4Y97yBgYykGgyKmwYoaHorPW1LfpyARve1-9x2B8/exec";

    var fotoBase64 = "";
    var fotoMimeType = "";
    var fotoNomeArquivo = "";

    function mudarAba(aba) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      if(aba === 'motorista') {
        document.getElementById('pag-motorista').classList.add('active');
        document.querySelector("[onclick*='motorista']").classList.add('active');
        carregarIdsDisponiveis();
      } else {
        document.getElementById('pag-pc').classList.add('active');
        document.querySelector("[onclick*='pc']").classList.add('active');
        atualizarPainel();
      }
    }

    function alternarCamposMotorista() {
      var tipo = document.getElementById('tipoRegistro').value;
      if (tipo === 'existente') {
        document.getElementById('campoCasoExistente').classList.remove('hidden');
        document.getElementById('camposNovos').classList.add('hidden');
        carregarIdsDisponiveis();
      } else {
        document.getElementById('campoCasoExistente').classList.add('hidden');
        document.getElementById('camposNovos').classList.remove('hidden');
      }
    }

    function visualizarFoto(event) {
      var file = event.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('preview').src = e.target.result;
          document.getElementById('preview').style.display = 'block';
          var partes = e.target.result.split(',');
          fotoBase64 = partes[1];
          fotoMimeType = file.type;
          fotoNomeArquivo = file.name;
        };
        reader.readAsDataURL(file);
      }
    }

    function carregarIdsDisponiveis() {
      fetch(URL_API_GOOGLE)
      .then(res => res.json())
      .then(dados => {
        var select = document.getElementById('listaCasos');
        select.innerHTML = '';
        dados.linhas.forEach(function(linha) {
          select.innerHTML += '<option value="'+linha[0]+'">'+linha[0]+'</option>';
        });
      }).catch(err => console.error("Erro ao carregar IDs:", err));
    }

    function enviarDadosMotorista() {
      var tipo = document.getElementById('tipoRegistro').value;
      var payload = { status: document.getElementById('status').value };

      if (tipo === 'existente') {
        payload.id = document.getElementById('listaCasos').value;
      } else {
        payload.motorista = document.getElementById('motorista').value;
        payload.placa = document.getElementById('placa').value;
        payload.tipoVeiculo = document.getElementById('tipoVeiculo').value;
        payload.notaFiscal = document.getElementById('notaFiscal').value;
        payload.serie = document.getElementById('serie').value;
        payload.fotoBytes = fotoBase64;
        payload.fotoMime = fotoMimeType;
        payload.fotoNome = fotoNomeArquivo;
      }

      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('loadingForm').style.display = 'block';

      // Envia os dados via rede externa (CORS/Fetch) para a API do Google
      fetch(URL_API_GOOGLE, {
        method: 'POST',
        redirect: 'follow',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        alert(res.msg);
        location.reload();
      })
      .catch(err => {
        alert("Erro ao enviar dados.");
        document.getElementById('btnEnviar').disabled = false;
        document.getElementById('loadingForm').style.display = 'none';
      });
    }

    function atualizarPainel() {
      fetch(URL_API_GOOGLE)
      .then(res => res.json())
      .then(dados => {
        var tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';
        
        for (var i = dados.linhas.length - 1; i >= 0; i--) {
          var linha = dados.linhas[i];
          var tr = document.createElement('tr');
          
          (function(dadosLinha){
            tr.onclick = function(e) {
              if(e.target.tagName !== 'A') {
                alert("Caso: " + dadosLinha[0] + "\nMotorista: " + dadosLinha[1] + "\nNF: " + dadosLinha[4]);
              }
            };
          })(linha);

          var dataFormatada = new Date(linha[7]).toLocaleString('pt-BR');
          var colunaFoto = (linha[8] && linha[8].indexOf('http') === 0) ? '<a href="' + linha[8] + '" target="_blank">Abrir link</a>' : '-';

          tr.innerHTML = '<td><strong>' + linha[0] + '</strong></td>' +
                         '<td>' + (linha[1] || '-') + '</td>' +
                         '<td>' + (linha[2] || '-') + '</td>' +
                         '<td>' + (linha[3] || '-') + '</td>' +
                         '<td>' + (linha[4] || '-') + '</td>' +
                         '<td>' + (linha[5] || '-') + '</td>' +
                         '<td>' + linha[6] + '</td>' +
                         '<td>' + dataFormatada + '</td>' +
                         '<td>' + colunaFoto + '</td>';
          tbody.appendChild(tr);
        }
      }).catch(err => console.error("Erro ao atualizar painel:", err));
    }

    function exportarExcel() {
      var tabela = document.getElementById("tabelaOcorrencias");
      var livro = XLSX.utils.table_to_book(tabela, { sheet: "Ocorrências" });
      XLSX.writeFile(livro, "Relatorio_Ocorrencias.xlsx");
    }

    carregarIdsDisponiveis();
    setInterval(atualizarPainel, 20000); 
  </script>
</body>
</html>
