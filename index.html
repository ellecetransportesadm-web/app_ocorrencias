<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sistema de Ocorrências - Logística</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
    .navbar { display: flex; background: #2c3e50; padding: 10px; justify-content: center; gap: 15px; }
    .nav-btn { background: #34495e; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 4px; }
    .nav-btn.active { background: #27ae60; }
    .container { max-width: 1200px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .page { display: none; }
    .page.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea, button { width: 100%; padding: 10px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; font-size: 15px; }
    input:disabled, select:disabled { background-color: #e9ecef; color: #495057; cursor: not-allowed; }
    textarea { resize: vertical; font-family: inherit; }
    button { background: #2980b9; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #3498db; }
    .btn-excel { background-color: #27ae60; width: auto; margin-bottom: 15px; display: inline-block; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #2c3e50; color: white; }
    tr:hover { background-color: #f1f1f1; cursor: pointer; }
    #preview { max-width: 150px; margin-top: 10px; display: none; border-radius: 4px; border: 1px solid #ddd; }
    .loading { font-weight: bold; color: #e67e22; text-align: center; padding: 10px; display: none; }
  </style>
</head>
<body>

  <div class="navbar">
    <button class="nav-btn active" onclick="mudarAba('motorista')">📱 Motorista</button>
    <button class="nav-btn" onclick="mudarAba('pc'); atualizarPainel();">💻 Painel PC</button>
  </div>

  <div class="container">
    
    <div id="pag-motorista" class="page active">
      <h2>Registro de Ocorrência (Motorista)</h2>
      
      <div id="camposNovos">
        <div class="form-group">
          <label>Selecione a Placa do Veículo:</label>
          <select id="placa" onchange="autoPreencherMotorista()">
            <option value="">Carregando placas disponíveis...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Nome do Motorista:</label>
          <input type="text" id="motorista" placeholder="Selecione a placa acima" disabled>
        </div>
        <div class="form-group">
          <label>Tipo de Veículo:</label>
          <input type="text" id="tipoVeiculo" placeholder="Selecione a placa acima" disabled>
        </div>
        <div class="form-group">
          <label>Número da NF:</label>
          <input type="number" id="notaFiscal">
        </div>
        <div class="form-group">
          <label>Série da NF:</label>
          <input type="number" id="serie">
        </div>
        <div class="form-group">
          <label>Anexar Foto da Ocorrência:</label>
          <input type="file" id="foto" accept="image/*" onchange="visualizarFoto(event)">
          <img id="preview" alt="Prévia da imagem">
        </div>
      </div>

      <div class="form-group">
        <label>Status da Entrega:</label>
        <select id="status">
          <option value="Em trânsito">Em trânsito</option>
          <option value="Entregue">Entregue</option>
          <option value="Insucesso de Entrega">Insucesso de Entrega</option>
          <option value="Devolução Total">Devolução Total</option>
        </select>
      </div>

      <div class="form-group">
        <label>Observações / Detalhes do Caso:</label>
        <textarea id="observacao" rows="3" placeholder="Insira detalhes da ocorrência (Ex: Cliente recusou por avaria, atraso na descarga, etc.)"></textarea>
      </div>

      <div id="loadingForm" class="loading">Processando e enviando dados, por favor aguarde...</div>
      <button id="btnEnviar" onclick="enviarDadosMotorista()">Enviar Informações</button>
    </div>

    <div id="pag-pc" class="page">
      <h2>Painel de Controle - Monitoramento</h2>
      <button class="btn-excel" onclick="exportarExcel()">📊 Gerar Excel</button>
      
      <table id="tabelaOcorrencias">
        <thead>
          <tr>
            <th>ID Caso</th>
            <th>Motorista</th>
            <th>Placa</th>
            <th>Veículo</th>
            <th>NF</th>
            <th>Série</th>
            <th>Status</th>
            <th>Data</th>
            <th>Hora</th>
            <th>Observação</th>
            <th>Foto</th>
          </tr>
        </thead>
        <tbody id="corpoTabela">
          <tr><td colspan="11">Carregando dados...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const URL_API_GOOGLE = "https://script.google.com/macros/s/AKfycbyhvPMpQ9vF6ZrDv-0k6iTrUN_UDZNOMb0-YUFK2GD58Ki9ePQFT3h8OAxeE6E3b-Be/exec";

    var listaGlobalMotoristas = []; 
    var fotoBase64 = "";
    var fotoMimeType = "";
    var fotoNomeArquivo = "";

    function mudarAba(aba) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      if(aba === 'motorista') {
        document.getElementById('pag-motorista').classList.add('active');
        document.querySelector("[onclick*='motorista']").classList.add('active');
        carregarListaPlacas();
      } else {
        document.getElementById('pag-pc').classList.add('active');
        document.querySelector("[onclick*='pc']").classList.add('active');
        atualizarPainel();
      }
    }

    function carregarListaPlacas() {
      var urlConsulta = URL_API_GOOGLE + (URL_API_GOOGLE.includes('?') ? '&' : '?') + 'acao=motoristas';
      
      fetch(urlConsulta)
      .then(res => res.json())
      .then(dados => {
        if (!dados.motoristas) {
          console.error("Dados de motoristas não encontrados.");
          return;
        }
        
        listaGlobalMotoristas = dados.motoristas;
        var selectPlaca = document.getElementById('placa');
        selectPlaca.innerHTML = '<option value="">-- Selecione sua Placa --</option>';
        
        listaGlobalMotoristas.forEach(function(item) {
          if (item[0]) { 
            selectPlaca.innerHTML += '<option value="' + item[0] + '">' + item[0] + '</option>';
          }
        });
      }).catch(err => {
        console.error("Erro crítico ao carregar placas:", err);
        document.getElementById('placa').innerHTML = '<option value="">Erro ao carregar placas</option>';
      });
    }

    function autoPreencherMotorista() {
      var placaSelecionada = document.getElementById('placa').value;
      var inputMotorista = document.getElementById('motorista');
      var inputVeiculo = document.getElementById('tipoVeiculo');
      
      if (!placaSelecionada) {
        inputMotorista.value = "";
        inputVeiculo.value = "";
        return;
      }
      
      var cadastroEncontrado = listaGlobalMotoristas.find(item => item[0] === placaSelecionada);
      
      if (cadastroEncontrado) {
        inputMotorista.value = cadastroEncontrado[1]; 
        inputVeiculo.value = cadastroEncontrado[2];   
      }
    }

    function visualizarFoto(event) {
      var file = event.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('preview').src = e.target.result;
          document.getElementById('preview').style.display = 'block';
          var partes = e.target.result.split(',');
          fotoBase64 = partes[1];
          fotoMimeType = file.type;
          fotoNomeArquivo = file.name;
        };
        reader.readAsDataURL(file);
      }
    }

    function enviarDadosMotorista() {
      var payload = {
        placa: document.getElementById('placa').value,
        motorista: document.getElementById('motorista').value,
        tipoVeiculo: document.getElementById('tipoVeiculo').value,
        notaFiscal: document.getElementById('notaFiscal').value,
        serie: document.getElementById('serie').value,
        status: document.getElementById('status').value,
        observacao: document.getElementById('observacao').value,
        fotoBytes: fotoBase64,
        fotoMime: fotoMimeType,
        fotoNome: fotoNomeArquivo
      };

      if (!payload.placa || !payload.notaFiscal) {
        alert("Por favor, selecione a Placa e preencha o número da Nota Fiscal.");
        return;
      }

      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('loadingForm').style.display = 'block';

      fetch(URL_API_GOOGLE, {
        method: 'POST',
        redirect: 'follow',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        alert(res.msg);
        location.reload();
      })
      .catch(err => {
        alert("Erro ao enviar dados.");
        document.getElementById('btnEnviar').disabled = false;
        document.getElementById('loadingForm').style.display = 'none';
      });
    }

    function atualizarPainel() {
      fetch(URL_API_GOOGLE)
      .then(res => res.json())
      .then(dados => {
        var tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';
        
        if (!dados.linhas || dados.linhas.length === 0) {
          tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;">Nenhuma ocorrência localizada.</td></tr>';
          return;
        }

        for (var i = dados.linhas.length - 1; i >= 0; i--) {
          var linha = dados.linhas[i];
          var tr = document.createElement('tr');
          
          (function(dadosLinha){
            tr.onclick = function(e) {
              if(e.target.tagName !== 'A') {
                alert("Caso: " + dadosLinha[0] + "\nMotorista: " + dadosLinha[1] + "\nNF: " + dadosLinha[4] + "\nStatus: " + dadosLinha[6] + "\nObs: " + (dadosLinha[9] || '-'));
              }
            };
          })(linha);

          var dataExibicao = linha[7] ? linha[7] : '-';
          var horaExibicao = linha[8] ? linha[8] : '-';
          var obsExibicao = linha[9] ? linha[9] : '-';
          var colunaFoto = (linha[10] && linha[10].indexOf('http') === 0) ? '<a href="' + linha[10] + '" target="_blank">Abrir link</a>' : '-';

          tr.innerHTML = '<td><strong>' + linha[0] + '</strong></td>' +
                         '<td>' + (linha[1] || '-') + '</td>' +
                         '<td>' + (linha[2] || '-') + '</td>' +
                         '<td>' + (linha[3] || '-') + '</td>' +
                         '<td>' + (linha[4] || '-') + '</td>' +
                         '<td>' + (linha[5] || '-') + '</td>' +
                         '<td>' + (linha[6] || '-') + '</td>' +
                         '<td>' + dataExibicao + '</td>' +
                         '<td>' + horaExibicao + '</td>' +
                         '<td>' + obsExibicao + '</td>' +
                         '<td>' + colunaFoto + '</td>';
          tbody.appendChild(tr);
        }
      }).catch(err => console.error("Erro ao atualizar painel:", err));
    }

    function exportarExcel() {
      var tabela = document.getElementById("tabelaOcorrencias");
      var livro = XLSX.utils.table_to_book(tabela, { sheet: "Ocorrências" });
      XLSX.writeFile(livro, "Relatorio_Ocorrencias.xlsx");
    }

    carregarListaPlacas();

    setInterval(function() {
      if (document.getElementById('pag-pc').classList.contains('active')) {
        atualizarPainel();
      }
    }, 20000);
  </script>
</body>
</html>
